<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>New Tab</title>
<link rel="stylesheet" href="/chrome.css" />
<script src="/baremux/index.js"></script>
<script src="/scramjet.bundle.js"></script>
</head>
<body>

  <!-- ================= TAB STRIP ================= -->
  <div id="tabstrip" class="tab-strip">
    <div id="tabs" class="tabs"><!-- tabs injected by app.js --></div>
    <button id="newtab" class="newtab-btn" title="New tab">+</button>
    <div class="window-controls">
      <button class="wc" title="Minimize">&#8211;</button>
      <button class="wc" title="Maximize">&#9633;</button>
      <button class="wc wc-close" title="Close">&#10005;</button>
    </div>
  </div>

  <!-- ================= TOOLBAR ================= -->
  <div class="toolbar">
    <div class="nav-buttons">
      <button id="back" class="nav-btn" title="Back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <button id="forward" class="nav-btn" title="Forward">
        <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      </button>
      <button id="reload" class="nav-btn" title="Reload">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>

    <div class="omnibox-wrap">
      <div class="omnibox">
        <button id="info" class="omni-icon" title="View site information">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        </button>
        <input id="address" type="text" spellcheck="false" autocomplete="off"
               placeholder="Search or type a URL" />
        <button id="bookmark" class="omni-icon omni-right" title="Bookmark this tab">
          <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3.5L19 21V5c0-1.1-.9-2-2-2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </div>

    <div class="toolbar-right">
      <button class="nav-btn" title="Extensions">
        <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-2 .9-2 2v3.8h1.5a2.7 2.7 0 0 1 0 5.4H2V20c0 1.1.9 2 2 2h3.8v-1.5a2.7 2.7 0 0 1 5.4 0V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
      </button>
      <button class="avatar" title="Profile">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </button>
      <button id="menu" class="nav-btn" title="Customize and control">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </div>
  </div>

  <!-- ================= CONTENT AREA ================= -->
  <div id="content" class="content">
    <!-- proxied frames injected here, one per tab -->
  </div>

  <script src="/app.js"></script>
</body>
</html>
